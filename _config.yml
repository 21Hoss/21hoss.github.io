title: kelvin's Website
description: Enumeration is Key.
remote_theme: "pages-themes/hacker@v0.2.0"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap

kramdown:
  parse_block_html: true
  smart_quotes: ["apos", "apos", "quot", "quot"]

baseurl: ""
url: "https://21hoss.github.io"

collections:
  writeups:
    output: true
    permalink: /ctf/:path/

defaults:
  - scope:
      path: ""
      type: writeups
    values:
      layout: default

exclude:
  - ctf-template.md

header_pages:
  - index.md
  - ctf/index.md
  - research/index.md
  - blog/index.md
  - projects.md
  - about/index.md
